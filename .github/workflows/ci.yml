name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tallerista_ci
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests sobre SQLite (entorno de desarrollo)
        run: python manage.py test taller

      - name: Tests sobre PostgreSQL (mismo motor que producción)
        # SQLite y PostgreSQL no se comportan igual: los bloqueos de fila y el
        # manejo de fechas con zona horaria sólo se verifican de verdad acá.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tallerista_ci
          DJANGO_DEBUG: "True"
        run: python manage.py test taller

      - name: Revisión de configuración de producción
        # Reproduce el entorno de Railway para que los errores de despliegue
        # aparezcan acá y no después de publicar.
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ${{ github.sha }}-solo-para-ci-no-es-un-secreto-real
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_API_DOCS_ENABLED: "False"
        run: python manage.py check --deploy --fail-level ERROR

      - name: Migraciones al día
        # Falla si alguien cambió un modelo y no generó la migración.
        run: python manage.py makemigrations --check --dry-run

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-taller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-taller/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # El build necesita la variable definida; el valor no se usa porque
          # en CI no se llama al backend.
          NEXT_PUBLIC_API_BASE_URL: https://ci.example.com/api
        run: npm run build
